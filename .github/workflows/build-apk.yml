name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 34 + NDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" >/dev/null || true

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare release keystore (optional)
        id: sign
        env:
          KB: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "${KB}" ]; then
            echo "${KB}" | base64 -d > app/release.keystore
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PASSWORD=filebridge2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=filebridge" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=filebridge2026" >> "$GITHUB_ENV"
          fi

      - name: Diagnose nanohttpd classpath
        run: |
          gradle --no-daemon :app:dependencies --configuration debugCompileClasspath > /tmp/deps.txt 2>&1 || true
          echo "===== nanohttpd ====="
          grep -n -i nanohttpd /tmp/deps.txt || echo "(no nanohttpd line)"
          echo "===== other mavenCentral deps ====="
          grep -n -iE "zxing|bouncycast|conscrypt" /tmp/deps.txt || echo "(none)"
          echo "===== failure markers ====="
          grep -niE "FAILED|Could not|Unable to|error:" /tmp/deps.txt | head -40
          echo "===== tail ====="
          tail -30 /tmp/deps.txt

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'yes'
        run: gradle --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: filebridge-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error