name: Build Flutter (Rust core)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "ndk;25.2.9519653" >/dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 3.47.1: flutter_foreground_task 10.x 要求 Flutter>=3.38
          flutter-version: '3.47.1'
          cache: true

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # 只编译真机主流的 64 位 ABI (arm64-v8a), 去除 v7/x86, 最小体积与最快构建
          rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 生成 Flutter Android 骨架: flutter create 会覆盖已存在文件,
      # 因此先生成到临时目录, 再把 android/ 拷贝回 flutter_app(保留我们的源码/pubspec)。
      - name: Generate Flutter Android scaffold
        run: |
          set -e
          TMP=$(mktemp -d)
          flutter create --org com.filebridge --project-name filebridge_flutter \
            --platforms=android --no-pub "$TMP/scaffold"
          cp -r "$TMP/scaffold/android/." flutter_app/android/
          cd flutter_app
          flutter pub get

      - name: Patch manifest (INTERNET permission)
        run: |
          cd flutter_app
          bash ci/patch_manifest.sh

      - name: Enable R8 minify + shrinkResources (体积/启动优化)
        run: |
          cd flutter_app
          bash ci/patch_gradle.sh

      - name: Build Rust core (.so) and place into Flutter android jniLibs
        run: |
          set -e
          cd flutter_app
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          (cd rust && cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release)

      - name: Build release APK (per-ABI, obfuscated)
        run: |
          cd flutter_app
          flutter build apk --release --split-per-abi \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      - name: Upload Flutter APKs
        uses: actions/upload-artifact@v4
        with:
          name: filebridge-flutter-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error