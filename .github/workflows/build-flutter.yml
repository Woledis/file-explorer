name: Build Flutter (Rust core)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" >/dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust core (.so) and place into Flutter android jniLibs
        run: |
          set -e
          cd flutter_app
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/armeabi-v7a android/app/src/main/jniLibs/x86_64
          (cd rust && cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../android/app/src/main/jniLibs build --release)

      # Flutter 的 Android 骨架(含 gradle wrapper/plugin registrant)无法在本地生成,
      # 在此用 flutter create 生成到 flutter_app 目录,保留含 Android 的最小工程。
      - name: Generate Flutter Android scaffold
        run: |
          cd flutter_app
          flutter create --org com.filebridge --project-name filebridge_flutter \
            --platforms=android --no-pub .
          flutter pub get

      - name: Build debug + release APK
        run: |
          cd flutter_app
          flutter build apk --debug
          flutter build apk --release

      - name: Upload Flutter APKs
        uses: actions/upload-artifact@v4
        with:
          name: filebridge-flutter-apk
          path: |
            flutter_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error