name: filebridge_flutter
description: FileBridge - 局域网文件流转，核心 Rust + Flutter UI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  # 保险箱文件选择 + 私有可写目录
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  # 服务前台化: HTTP/FTP 运行时保持后台存活, 停止即移除(不常驻)
  flutter_foreground_task: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true