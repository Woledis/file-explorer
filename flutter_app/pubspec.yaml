name: filebridge_flutter
description: FileFlow 文件流 - 局域网文件流转，核心 Rust + Flutter UI.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  # 保险箱文件选择 + 私有可写目录
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  # 服务前台化: HTTP/FTP 运行时保持后台存活, 停止即移除(不常驻)
  # 9.x 兼容 CI 的 Flutter 3.24.5 (10.x 需 Flutter>=3.38)
  flutter_foreground_task: ^9.2.2
  # 存储权限: Android 11+ 访问 /storage/emulated/0 需 MANAGE_EXTERNAL_STORAGE
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # 生成各密度启动图标(CI 在 flutter create 重建 android 后运行)
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"